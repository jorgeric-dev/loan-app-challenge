x-backend: &backend
  build: ./backend
  image: loan-app-api
  environment: &backend-env
    ConnectionStrings__LoanDb: "Server=sqlserver,1433;Database=LoanApp;User Id=sa;Password=LoanApp!Passw0rd;TrustServerCertificate=True"
    ExternalCustomerService__BaseUrl: "http://external-service:4000/"
    Database__MigrateOnStartup: "false"
    Logging__Console__FormatterName: "json"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://observability:18889"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LoanApp!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LoanApp!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 30

  # Traces, metrics and structured logs of every backend instance (OTLP). UI: http://localhost:18888
  observability:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889" # OTLP, so an API running in your IDE can send telemetry too

  # One-shot job: applies EF Core migrations before any backend instance starts.
  migrations:
    <<: *backend
    command: ["--migrate-only"]
    depends_on:
      sqlserver:
        condition: service_healthy

  external-service:
    build: ./external-service-mock
    ports:
      - "4000:4000"

  # Serves HTTP and also delivers outbox events.
  api:
    <<: *backend
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: "loan-api"
    ports:
      - "5080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      external-service:
        condition: service_started

  # A second instance competing for the same outbox, to show delivery is safe with several instances.
  worker:
    <<: *backend
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: "loan-worker"
    depends_on:
      migrations:
        condition: service_completed_successfully
      external-service:
        condition: service_started

  web:
    build: ./web
    environment:
      API_URL: "http://api:8080"
    ports:
      - "3000:3000"
    depends_on:
      - api
